<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b2f45"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#10263b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="58" fill="#eaf4ff" font-size="30" font-weight="bold" text-anchor="middle">From Signal to System</text>
  <text x="480" y="86" fill="#7ec8ff" font-size="16" text-anchor="middle">End-to-End Communications for Robotic Navigation</text>

  <text x="60" y="130" fill="#ffd27f" font-size="15" font-weight="bold">Onboard Pipeline</text>
  <!-- pipeline boxes -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="145" width="150" height="74" rx="10" fill="url(#box)" stroke="#3aa0e0" stroke-width="1.5"/>
    <text x="135" y="170" fill="#dff3ff" font-weight="bold">SENSE</text>
    <text x="135" y="190" fill="#8fb6cc" font-size="11">LiDAR · IMU · Camera</text>
    <text x="135" y="206" fill="#8fb6cc" font-size="11">preprocessing / sync</text>

    <rect x="232" y="145" width="150" height="74" rx="10" fill="url(#box)" stroke="#3aa0e0" stroke-width="1.5"/>
    <text x="307" y="170" fill="#dff3ff" font-weight="bold">PERCEIVE</text>
    <text x="307" y="190" fill="#8fb6cc" font-size="11">sensor fusion</text>
    <text x="307" y="206" fill="#8fb6cc" font-size="11">SLAM front-end</text>

    <rect x="404" y="145" width="150" height="74" rx="10" fill="url(#box)" stroke="#3aa0e0" stroke-width="1.5"/>
    <text x="479" y="170" fill="#dff3ff" font-weight="bold">MAP</text>
    <text x="479" y="190" fill="#8fb6cc" font-size="11">occupancy grid</text>
    <text x="479" y="206" fill="#8fb6cc" font-size="11">costmap</text>

    <rect x="576" y="145" width="150" height="74" rx="10" fill="url(#box)" stroke="#3aa0e0" stroke-width="1.5"/>
    <text x="651" y="170" fill="#dff3ff" font-weight="bold">PLAN</text>
    <text x="651" y="190" fill="#8fb6cc" font-size="11">global A*</text>
    <text x="651" y="206" fill="#8fb6cc" font-size="11">local DWA</text>

    <rect x="748" y="145" width="150" height="74" rx="10" fill="url(#box)" stroke="#3aa0e0" stroke-width="1.5"/>
    <text x="823" y="170" fill="#dff3ff" font-weight="bold">CONTROL</text>
    <text x="823" y="190" fill="#8fb6cc" font-size="11">PID velocity</text>
    <text x="823" y="206" fill="#8fb6cc" font-size="11">motor interface</text>
  </g>
  <!-- arrows -->
  <g stroke="#5fa8d3" stroke-width="2.5" marker-end="url(#arw)">
    <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5fa8d3"/></marker></defs>
    <line x1="210" y1="182" x2="230" y2="182"/>
    <line x1="382" y1="182" x2="402" y2="182"/>
    <line x1="554" y1="182" x2="574" y2="182"/>
    <line x1="726" y1="182" x2="746" y2="182"/>
  </g>

  <!-- comms constraint band -->
  <rect x="60" y="240" width="838" height="120" rx="12" fill="none" stroke="#e06666" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="479" y="262" fill="#ff9d9d" font-size="14" font-weight="bold" text-anchor="middle">COMMUNICATIONS CONSTRAINT (wireless link)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="110" y="278" width="210" height="44" rx="8" fill="#202c45" stroke="#e06666" stroke-width="1.2"/>
    <text x="215" y="296" fill="#ffd27f" font-weight="bold">bandwidth_mbps</text>
    <text x="215" y="313" fill="#cfe0ef">0.5 Mbps (constrained)</text>
    <rect x="350" y="278" width="180" height="44" rx="8" fill="#202c45" stroke="#e06666" stroke-width="1.2"/>
    <text x="440" y="296" fill="#ffd27f" font-weight="bold">latency_ms</text>
    <text x="440" y="313" fill="#cfe0ef">150 ms</text>
    <rect x="560" y="278" width="190" height="44" rx="8" fill="#202c45" stroke="#e06666" stroke-width="1.2"/>
    <text x="655" y="296" fill="#ffd27f" font-weight="bold">packet_loss_rate</text>
    <text x="655" y="313" fill="#cfe0ef">2%</text>
    <rect x="780" y="278" width="90" height="44" rx="8" fill="#202c45" stroke="#e06666" stroke-width="1.2"/>
    <text x="825" y="296" fill="#ffd27f" font-weight="bold">QoS</text>
    <text x="825" y="313" fill="#cfe0ef">sparse-diff</text>
  </g>

  <!-- chart -->
  <text x="60" y="405" fill="#ffd27f" font-size="15" font-weight="bold">Coverage vs Time</text>
  <g stroke="#5fa8d3" stroke-width="1.5">
    <line x1="90" y1="430" x2="90" y2="490"/>
    <line x1="90" y1="490" x2="850" y2="490"/>
  </g>
  <text x="70" y="490" fill="#8fb6cc" font-size="11" text-anchor="end">0%</text>
  <text x="70" y="452" fill="#8fb6cc" font-size="11" text-anchor="end">50%</text>
  <text x="70" y="416" fill="#8fb6cc" font-size="11" text-anchor="end">100%</text>
  <text x="470" y="510" fill="#8fb6cc" font-size="12" text-anchor="middle">exploration time (s)</text>
  <polyline points="90,432 160,428 230,419 300,405 370,386 440,364 510,344 580,326 650,312 720,302 790,295 850,291"
    fill="none" stroke="#5fe3a0" stroke-width="3"/>
  <polyline points="90,486 160,482 230,474 300,462 370,445 440,426 510,410 580,398 650,390 720,384 790,380 850,378"
    fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="7 4"/>
  <rect x="620" y="430" width="14" height="14" fill="#5fe3a0"/>
  <text x="640" y="442" fill="#cfe0ef" font-size="12">full-map updates</text>
  <rect x="620" y="454" width="14" height="14" fill="#ff6b6b"/>
  <text x="640" y="466" fill="#cfe0ef" font-size="12">sparse-diff (limited BW)</text>

  <text x="480" y="532" fill="#7ec8ff" font-size="12" text-anchor="middle">Demo Preview · From Signal to System</text>
</svg>
